services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: erp_inventory
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d erp_inventory"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
